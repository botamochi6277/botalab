  - id: sazanami
    project_id: katana
    name: 箔文 漣 (はくもん さざなみ)
    mainImage: sazanami.jpg
    materials:
      - Seeed Studio XIAO nRF52840 Sense
      - NeoPixel
      - 18650 Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - PlatformIO
    description: "\
      光が漏れてしまう隙間を減らすためにプリントパーツの径方向の分割をなくしました．\
      軸方向においては，溶剤系接着剤とパテを活用し隙間を減らしています．\
      しかし，光の透過特性が変わってしまうため，発行時には継ぎ目が目立ってしまうのが課題となっています．\
      初期は塗装により鎬部分を遮光していましたが，剥がれ易かったため遮光テープに切り替えました．"
    createDate: 2024-06-22
  - id: hatsushimo
    project_id: katana
    name: 蛍晶 初霜 (けいしょう はつしも)
    mainImage: hatsushimo.jpg
    materials:
      - Seeed Studio XIAO nRF52840 Sense
      - NeoPixel
      - 18650 Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - PlatformIO
      - Bambu Lab P1S
    description: "\
      家庭用の3Dプリンターでは大刀の刀身を一度に出力できません． \
      そこで複数の分割したパーツで作成することを前提に，継ぎ目をあえて目立たせた刀身を設計しました．\
      また，柄の縁部分にボタンを配置し，色と発光パターンを変えられるようにしています．"
    createDate: 2025-06-01
  - id: hoshinagi
    project_id: katana
    name: 蛍晶 星薙 (けいしょう ほしなぎ)
    mainImage: hoshinagi.jpg
    materials:
      - Proffieboard V3
      - NeoPixel
      - 18650 Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - Arduino IDE
      - Bambu Lab P1S
    description: "\
      前作の初霜の設計を元にしつつ，自作ライトセーバー用のマイコンを採用しました．\
      効果音の再生・疑似的な触感フィードバック，斬撃に応じた光・音の放出など，表現の幅が大きく広がっています．\
      芯材にJLCCNCのアルミ切削加工部品を導入し捻じり方向の荷重への対応を行っています．"
    createDate: 2026-06-01
  - id: inyou
    project_id: katana
    name: 陰陽 朔 (いんよう さく)
    mainImage: inyou.jpg
    materials:
      - Seeed Studio XIAO nRF52840 Sense
      - NeoPixel
      - RCR123A Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - PlatformIO
      - Bambu Lab P1S
    description: "\
      鍔のない合口拵に挑戦するために試作した短刀です．\
      LEDの粒を隠すために刃側と峰側で素材の色を切り替えています．\
      つなぎ目には溶剤系の接着材を使ったうえで，やすり掛けをし目立たなくさせています．"
    createDate: 2025-03-01
  - id: hakuso
    project_id: katana
    name: 白素 虹目 (はくそ こうもく)
    mainImage: hakuso.jpg
    materials:
      - Seeed Studio XIAO nRF52840 Sense
      - NeoPixel
      - RCR123A Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - PlatformIO
    description: "\
      二刀差しをするために用意した脇差です．\
      大刀に比べ柄が短いため，バッテリーを18650からRC123Aに変更しています．\
      初期は峰側に金属テープを張っていたが，安いおもちゃの印象が強くなったため，不採用となりました．"
    createDate: 2024-11-09
  - id: bokumon
    project_id: katana
    name: 墨紋 大波 (ぼくもん おおなみ)
    mainImage: bokumon.jpg
    materials:
      - Seeed Studio XIAO nRF52840 Sense
      - NeoPixel
      - 18650 Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - PlatformIO
      - Adventurer 3
    description: "\
      塗装によりLEDの粒を隠蔽を試みた試作品です．\
      遮光のためには3，4回塗り重ねる必要があります．\
      しかし，抜刀・納刀時に鞘と擦れて塗装が剥がれやすく耐久性に難があります．"
    createDate: 2024-06-22

      光が漏れてしまう隙間を減らすためにプリントパーツの径方向の分割をなくしている．\
      初期は塗装により鎬部分を遮光していたが，剥がれ易かったため遮光テープに切り替えている．"
    exhibitions: []
    competitions:
      - Mouser Make Awards 2023
      - ヒーローズ・リーグ 2023
    createDate: 2024-01-01
  - id: hatsushimo
    project_id: katana
    name: 蛍晶 初霜 (けいしょう はつしも)
    mainImage: https://placehold.jp/800x600.png?text=%E8%9B%AE%E6%99%B6%20%E5%88%9D%E9%9C%9C%20%28%E3%81%91%E3%81%84%E3%81%A1%E3%82%87%E3%81%86%20%E3%81%AF%E3%81%A4%E3%81%97%E3%82%82%29
    materials:
      - Seeed Studio XIAO nRF52840 Sense
      - NeoPixel
      - 18650 Li-ion Battery
    tools:
      - Blender
      - Fusion360
      - PlatformIO
    description: "\
      家庭用の3Dプリンターでは刀身を一度に出力できない． \
      そこで複数の分割したパーツで作成することを前提に，継ぎ目をあえて目立たせた刀身を設計した．\
      また，濃口部分にボタンを配置し，色と発光パターンを変えられるようになっている．"
    exhibitions: []
    competitions: []
    createDate: 2024-10-01
